name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 src/ tests/ --max-line-length=120 --exclude=__pycache__

      - name: Prepare data
        run: |
          python data/download_data.py
          python -c "from src.data_prep.prepare import run; run()"

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Train model
        run: |
          python -c "from src.training.train import run; run()"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: model/artifacts/

      - name: Build Docker image
        run: |
          docker build -t heart-disease-api:${{ github.sha }} -t heart-disease-api:latest .

      - name: Test Docker container
        run: |
          docker run -d --name test-api -p 8080:8080 heart-disease-api:latest
          sleep 5
          curl -f http://localhost:8080/health || exit 1
          curl -f -X POST http://localhost:8080/predict \
            -H "Content-Type: application/json" \
            -d '{"age":63,"sex":1,"cp":1,"trestbps":145,"chol":233,"fbs":1,"restecg":2,"thalach":150,"exang":0,"oldpeak":2.3,"slope":3,"ca":0,"thal":6}' \
            || exit 1
          docker stop test-api
          docker rm test-api
